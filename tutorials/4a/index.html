<!DOCTYPE html>
<html>
  <head>
    <title>Example 4a</title>
    <style>
      body {
          padding: 0;
          margin: 0;
      }

      cord-load-templates {
          display: none;
      }

      .main {
          width: 100vw;
          height: 100vh;          
      }

      .counter {
          position: relative;
          height: 100%;
      }
      .counter::after {
          content: attr(color);
          position: absolute;
          left: 50%;
          top: 50%;
          transform: translate(-50%, -50%);
          font-size: 5rem;
      }
    </style>
  </head>
  <body>
    <cord-load-templates>
      ./counter.ctpl
    </cord-load-templates>

    <div class="main">
      <cord-container cord-id="counter1" cord-tpl-ref="tpl-counter"
                      style="display: block; height: 50%;">
      </cord-container>
      
      <cord-container cord-id="counter2" cord-tpl-ref="tpl-counter"
                      style="display: block; height: 50%;">
      </cord-container>
    </div>
    
    <script>
     window.addEventListener('cordready', function(e) {
         const config = {
             createGlobals: false,
             strict: false,
             containers: {
                 counter1: {
                     counter: 10
                 },
                 counter2: {
                     counter: 20
                 }
             }
         };
         $CORD.init(config);
     });
    </script>
    <script src="../../cord.js"></script>
  </body>
</html>
