<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>For my tests...</title>

</head>

<body>
  <cord-container cord-id="test">
    <input on:input="$self.$input1=this.value"/>
    <div>
      INPUP1 Value: ${input1}
    </div>
    <input type="checkbox" bind:checked="$self.$input2"/>
    <div>
      INPUP2 Value: ${input2}
    </div>
  </cord-container>

  <cord-container cord-id="box">
    <div style="
                display: ${$global.test.input2 && 'block' || 'none'};
                position: fixed; top: 0; right: 0; width: 50vw; height: 100vh;
                background-color: red;
                "
         >
    </div>
  </cord-container>
  
  <script>
    const config = {
        createGlobals: false,
        strict: true,
        containers: {
            test: {
                input1: "",
                input2: ""
            }
        }
    };

    window.addEventListener('cordready', async function(e) {
        $CORD.init(config);
    });
  </script>
  <script src="../cord.js"></script>
</body>

</html>
