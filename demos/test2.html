<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tree Menu Demo</title>

  <style>
    button::after {
      content: attr(a);
      margin-left: 10px;
    }
  </style>
</head>

<body>
  <cord-container cord-id="main">
    <h5>Container MAIN</h5>
    :foreach it in list :do
    <div>${it.a}</div>
    :endforeach
  </cord-container>

  <script>
    const config = {
        createGlobals: false,
        strict: true,
        containers: {
          main: {
            list: [{a: 10}, {a: 20}, {a: 30}],
          }
        }
    };

    window.addEventListener('cordready', async function(e) {
        $CORD.init(config);
    });
  </script>
  <script src="../cord.js"></script>
</body>
</html>
